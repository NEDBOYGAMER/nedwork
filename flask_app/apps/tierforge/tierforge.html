<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TierForge</title>
  <link rel="stylesheet" href="/apps/{{ app_name }}/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <header>
    <div class="logo">Tier<span>Forge</span></div>
    <div class="header-actions">
      <label class="btn btn-primary" for="imageUpload">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload Images
      </label>
      <input type="file" id="imageUpload" multiple accept="image/*" hidden />
      <button class="btn btn-ghost" id="addTierBtn">+ Add Tier</button>
      <button class="btn btn-ghost" id="clearAllBtn">Clear All</button>
      <button class="btn btn-ghost" id="settingsBtn" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
      <div class="dropdown" id="fileMenu">
        <button class="btn btn-ghost dropdown-toggle" id="fileMenuBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          File
          <svg class="caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="dropdown-menu" id="fileMenuDropdown" hidden>
          <button class="dropdown-item" id="saveBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save
          </button>
          <label class="dropdown-item" for="loadFileInput" id="loadBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Load
          </label>
          <input type="file" id="loadFileInput" accept=".tierforge" hidden />
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" id="exportPngBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Export PNG
          </button>
        </div>
      </div>

      <div class="export-group">
        <a class="btn btn-ghost" href="/app_corner" title="Back to App Corner">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7"/><path d="M9 22V12h6v10"/><path d="M4 10v10a1 1 0 0 0 1 1h4v-6h6v6h4a1 1 0 0 0 1-1V10"/></svg>
          Home
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="tier-title-wrap">
      <input type="text" id="tierTitle" class="tier-title-input" placeholder="Name your tier list…" maxlength="80" spellcheck="false" />
    </div>
    <div class="tier-board" id="tierBoard">
      <!-- Tiers rendered by JS -->
    </div>

    <div class="image-pool-section">
      <div class="pool-header">
        <span class="pool-title">Unranked Images</span>
        <span class="pool-count" id="poolCount">0 images</span>
      </div>
      <div class="image-pool" id="imagePool">
        <div class="pool-empty" id="poolEmpty">
          Upload images to start ranking them
        </div>
      </div>
    </div>
  </main>


  <!-- Image Preview Overlay (right-click) -->
  <div class="img-preview-overlay" id="imgPreviewOverlay" hidden>
    <img id="imgPreviewImage" src="" alt="" />
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModalOverlay" hidden>
    <div class="modal settings-modal">
      <div class="modal-header">
        <span>Settings</span>
        <button class="modal-close" id="settingsModalClose">✕</button>
      </div>
      <div class="modal-body">
        <label>Unranked Image Size</label>
        <select id="poolSizeSelect">
          <option value="72">Small</option>
          <option value="120" selected>Medium</option>
          <option value="180">Large</option>
          <option value="260">X-Large</option>
        </select>

        <label>Ranked Image Size</label>
        <select id="tierSizeSelect">
          <option value="72">Small</option>
          <option value="120" selected>Medium</option>
          <option value="180">Large</option>
          <option value="260">X-Large</option>
        </select>

        <label>Behavior</label>
        <label class="settings-toggle-row" title="Always show image names on cards, not just on hover">
          <input type="checkbox" id="showNamesToggle" />
          Show names
        </label>
        <label class="settings-toggle-row" title="Ask for confirmation before removing an image">
          <input type="checkbox" id="confirmDeleteToggle" />
          Confirm delete
        </label>
        <label class="settings-toggle-row" title='Ask for confirmation before "Clear All"'>
          <input type="checkbox" id="confirmClearToggle" checked />
          Confirm clear all
        </label>
        <label class="settings-toggle-row" title="Wide table — fill ~80% of screen width">
          <input type="checkbox" id="fullscreenTableToggle" />
          Wide table <kbd>F</kbd>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="resetSettingsBtn">Reset to Defaults</button>
        <button class="btn btn-primary" id="settingsDoneBtn">Done</button>
      </div>
    </div>
  </div>

  <!-- Tier Edit Modal -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <span>Edit Tier</span>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <label>Tier Label</label>
        <input type="text" id="tierLabelInput" placeholder="S" />
        <label>Color</label>
        <div class="color-swatches" id="colorSwatches"></div>
        <input type="color" id="tierColorInput" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="deleteTierBtn">Delete Tier</button>
        <button class="btn btn-primary" id="saveTierBtn">Save</button>
      </div>
    </div>
  </div>

  <script src="/apps/{{ app_name }}/app.js" defer></script>
</body>
</html>
