<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TierForge</title>
  
  <link rel="stylesheet" href="style.css" />
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="logo">
      <a href="/app_corner">Tier<span>Forge</span></a>
    </div>

    <div class="header-actions">
      <label class="btn btn-primary" for="imageUpload">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>Upload Images</span>
      </label>
      <input type="file" id="imageUpload" multiple accept="image/*" class="sr-only" hidden />

      <button class="btn btn-ghost" id="addTierBtn" type="button">+ Add Tier</button>
      <button class="btn btn-ghost btn-danger-hover" id="clearAllBtn" type="button">Clear All</button>

      <button class="btn btn-ghost" id="settingsBtn" title="Settings" type="button" aria-label="Settings">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Settings</span>
      </button>

      <div class="dropdown" id="fileMenu">
        <button class="btn btn-ghost dropdown-toggle" id="fileMenuBtn" aria-expanded="false" type="button">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span>File</span>
          <svg class="caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <div class="dropdown-menu" id="fileMenuDropdown" hidden>
          <button class="dropdown-item" id="saveBtn" type="button">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            <span>Save</span>
          </button>

          <label class="dropdown-item" for="loadFileInput" id="loadBtn">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span>Load</span>
          </label>
          <input type="file" id="loadFileInput" accept=".tierforge" hidden />

          <div class="dropdown-divider"></div>

          <button class="dropdown-item" id="exportPngBtn" type="button">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <span>Export PNG</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container">
    <section class="tier-title-wrap">
      <input 
        type="text" 
        id="tierTitle" 
        class="tier-title-input" 
        placeholder="Name your tier list…" 
        maxlength="80" 
        spellcheck="false" 
        aria-label="Tier List Title"
      />
    </section>

    <section class="tier-board-wrapper">
      <div class="tier-board" id="tierBoard">
        </div>
    </section>

    <section class="image-pool-section">
      <div class="pool-header">
        <span class="pool-title">Unranked Images</span>
        <span class="pool-count" id="poolCount">0 images</span>
      </div>
      <div class="image-pool" id="imagePool">
        <div class="pool-empty" id="poolEmpty">
          Upload images to start ranking them
        </div>
      </div>
    </section>
  </main>

  <div class="img-preview-overlay" id="imgPreviewOverlay" role="dialog" aria-hidden="true" hidden>
    <img id="imgPreviewImage" src="" alt="Preview" />
  </div>

  <div class="modal-overlay" id="settingsModalOverlay" role="dialog" aria-labelledby="settingsModalTitle" aria-hidden="true" hidden>
    <div class="modal settings-modal">
      <div class="modal-header">
        <h2 class="modal-title" id="settingsModalTitle">Settings</h2>
        <button class="modal-close" id="settingsModalClose" aria-label="Close modal">✕</button>
      </div>
      
      <div class="modal-body">
        <div class="form-group">
          <label for="poolSizeSelect">Unranked Image Size</label>
          <select id="poolSizeSelect" class="form-select">
            <option value="72">Small</option>
            <option value="120" selected>Medium</option>
            <option value="180">Large</option>
            <option value="260">X-Large</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tierSizeSelect">Ranked Image Size</label>
          <select id="tierSizeSelect" class="form-select">
            <option value="72">Small</option>
            <option value="120" selected>Medium</option>
            <option value="180">Large</option>
            <option value="260">X-Large</option>
          </select>
        </div>

        <div class="form-group flex-column gap-sm">
          <label class="form-label-header">Behavior</label>
          
          <label class="settings-toggle-row" title="Always show image names on cards, not just on hover">
            <input type="checkbox" id="showNamesToggle" />
            <span>Show names</span>
          </label>
          
          <label class="settings-toggle-row" title="Ask for confirmation before removing an image">
            <input type="checkbox" id="confirmDeleteToggle" />
            <span>Confirm delete</span>
          </label>
          
          <label class="settings-toggle-row" title="Ask for confirmation before Clear All">
            <input type="checkbox" id="confirmClearToggle" checked />
            <span>Confirm clear all</span>
          </label>
          
          <label class="settings-toggle-row" title="Wide table — fill ~80% of screen width">
            <input type="checkbox" id="fullscreenTableToggle" />
            <span>Wide table <kbd>F</kbd></span>
          </label>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-ghost" id="resetSettingsBtn" type="button">Reset Defaults</button>
        <button class="btn btn-primary" id="settingsDoneBtn" type="button">Done</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-labelledby="tierEditModalTitle" aria-hidden="true" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="tierEditModalTitle">Edit Tier</h2>
        <button class="modal-close" id="modalClose" aria-label="Close modal">✕</button>
      </div>
      
      <div class="modal-body">
        <div class="form-group">
          <label for="tierLabelInput">Tier Label</label>
          <input type="text" id="tierLabelInput" class="form-input" maxlength="10" placeholder="S" />
        </div>

        <div class="form-group">
          <label for="tierColorInput">Tier Color</label>
          <div class="color-swatches" id="colorSwatches"></div>
          <input type="color" id="tierColorInput" class="color-picker-input" />
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-danger" id="deleteTierBtn" type="button">Delete Tier</button>
        <button class="btn btn-primary" id="saveTierBtn" type="button">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
