<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/apps/{{ app_name }}/colors.css" />
<script>window.APP_BASE = "/apps/{{ app_name }}/";</script>
<script src="/apps/{{ app_name }}/colors.js" type="module" defer></script>
</head>
<body>

<header>
  <div class="header-left">
    <button class="icon-btn small" id="sidebar-toggle-btn" title="Toggle library panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
    </button>
    <div class="logo"><span class="dot"></span>Colors</div>
    <span class="hint" id="active-palette-label">Unsaved palette</span>
  </div>
  <div class="header-right">
    <button class="btn" id="save-btn" title="Save palette">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
      Save
    </button>

    <div class="dropdown-wrap" id="export-wrap">
      <button class="btn" id="export-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M20 21H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h1"/><path d="M19 14h1a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1"/></svg>
        Export
      </button>
      <div class="dropdown-menu">
        <button class="dropdown-item" data-export="full">Full <span class="sub">Colors edge to edge</span></button>
        <button class="dropdown-item" data-export="palette">Palette <span class="sub">Rounded, spaced swatches</span></button>
      </div>
    </div>

    <button class="btn primary" id="generate-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
      Generate
    </button>
  </div>
</header>

<div class="app-layout">
  <main id="palette-container"></main>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Library</span>
      <button class="tree-action-btn" id="new-top-btn" title="New library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="sidebar-tree" id="sidebar-tree"></div>
  </aside>
</div>

<div class="empty-msg">Hover the edge between two colors to insert a new one</div>

<canvas id="export-canvas" style="display:none;"></canvas>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <div id="modal-fields"></div>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel" type="button">Cancel</button>
      <button class="btn primary" id="modal-confirm" type="button">Create</button>
    </div>
  </div>
</div>

<div class="header-toast" id="header-toast"></div>

</body>
</html>
