<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monopoly Amriswil</title>
  <link rel="stylesheet" href="/apps/{{ app_name }}/css/style.css">
  <!-- Socket.IO client (vom Flask-SocketIO geliefert) -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- ================= MAIN MENU ================= -->
  <div id="screen-main" class="screen">
    <div class="hero">MONOPOLY</div>
    <div class="sub">Amriswil und Umgebung · Thurgau</div>

    <div class="menu-card">
      <h3>Lokal spielen (am selben Gerät)</h3>
      <label>Ihr Name</label>
      <input type="text" id="playerNameInput" placeholder="Ihr Name" value="Du">
      <div class="btn-row">
        <span class="dot" id="colorDot" style="background:#e2504f"></span>
        <button class="mini" onclick="Monopoly.ui.colorPreview(Monopoly.ui.colorIdx+1)">Farbe &#x21bb;</button>
      </div>
      <div id="playerList"></div>
      <div class="btn-row">
        <button class="alt" onclick="Monopoly.ui.addLocalPlayer('Bot','#3f8ef0')">+ Spieler</button>
      </div>
      <div class="btn-row">
        <button onclick="Monopoly.ui.startLocal()">Spiel starten</button>
      </div>
    </div>

    <div class="menu-card">
      <h3>Online (Code an Freunde senden)</h3>
      <div class="btn-row">
        <button class="alt" onclick="Monopoly.ui.startOnlineFlow()">Room erstellen</button>
        <button class="alt" onclick="Monopoly.ui.showJoinPrompt()">Mit Code beitreten</button>
      </div>
      <div id="connStatus" style="color:#cfe6f5">nicht verbunden</div>
    </div>
  </div>

  <!-- ================= LOBBY ================= -->
  <div id="screen-lobby" class="screen">
    <h2>Room-Code</h2>
    <div id="roomCode">----</div>
    <div id="lobbyInfo">Warten…</div>
    <div id="lobbyPlayers"></div>
    <div id="lobbyStatus"></div>
    <div class="btn-row">
      <button id="btnStartOnline" onclick="Monopoly.ui.startOnline()">Spiel starten</button>
      <button onclick="Monopoly.net.disconnect(); Monopoly.ui.show('screen-main')">Zurück</button>
    </div>
  </div>

  <!-- ================= GAME ================= -->
  <div id="screen-game" class="screen">
    <div id="topbar">
      <span class="ttl">MONOPOLY Amriswil</span>
      <span class="lobby-code" id="lobbyCodeTop"></span>
      <span style="margin-left:auto; cursor:pointer" onclick="Monopoly.ui.showMenu()">☰ Menü</span>
    </div>

    <div id="gameWrap">
      <div id="board"></div>
      <div id="sidePanel">
        <div id="playersPanel"></div>
        <div id="controlsArea">
          <div class="turn">Am Zug: <span id="turnPlayer"></span></div>
          <div id="statusText">…</div>
          <div class="dice-row">
            <div class="die" id="die1"></div>
            <div class="die" id="die2"></div>
            <div id="diceInfo"></div>
          </div>
          <button id="btnRoll">Würfeln</button>
          <button id="btnBail" style="display:none">Kaution CHF 50</button>
          <button id="btnFree" style="display:none">Frei-Karte</button>
          <button id="btnBuy" style="display:none">Kaufen</button>
          <button id="btnDont" style="display:none">Nicht kaufen</button>
          <button id="btnEnd" style="display:none">Zug beenden</button>
        </div>
        <div id="log"></div>
      </div>
    </div>
  </div>

  <!-- ================= MODAL ================= -->
  <div class="modal-mask" id="modal"><div class="modal" id="modalBox"></div></div>

  <script>
    /* app_name kommt von Flask ({{ app_name }}) – für alle fetch-Aufrufe */
    window.APP_NAME = '{{ app_name }}';
  </script>

  <script src="/apps/{{ app_name }}/js/data.js"></script>
  <script src="/apps/{{ app_name }}/js/board.js"></script>
  <script src="/apps/{{ app_name }}/js/engine.js"></script>
  <script src="/apps/{{ app_name }}/js/net.js"></script>
  <script src="/apps/{{ app_name }}/js/ui.js"></script>

  <script>
    Monopoly.loadData('/apps/' + window.APP_NAME + '/').then(function () {
      Monopoly.ui.boot();
    }).catch(function (e) {
      document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif">Fehler beim Laden der Daten: ' + e + '</div>';
    });
  </script>
</body>
</html>
