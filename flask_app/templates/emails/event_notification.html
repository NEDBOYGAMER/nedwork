<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: sans-serif; color: #222; max-width: 480px; margin: 0 auto;">
  <h2 style="margin-bottom: 4px;">{{ event.title }}</h2>
  {% if event.subtitle %}<p style="margin-top: 0; color: #555;">{{ event.subtitle }}</p>{% endif %}
  <p>{{ body }}</p>
  <p style="font-size: 13px; color: #777;">
    Open <a href="https://nedwork.ch{{ url_for('events.event_page', event_id=event.id) if event else '#' }}">Events</a> in nedwork to respond.
  </p>
  <p style="font-size: 12px; color: #aaa;">— nedwork</p>
</body>
</html>
