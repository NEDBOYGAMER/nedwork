<aside id="side-nav">

    <div class="image-container" id="logo-container">
        <img src="{{ url_for('static', filename='img/nedwork.png') }}" alt="Logo N" class="logo">
    </div>
    

    <hr class="seperator" id="seperator">

    <div class="nav-section" id="top-nav">
        <button class="nav-item" id="home-btn">Home</button>
        <button class="nav-item" id="events-btn">Events</button>
        <button class="nav-item" id="socials-btn">Socials</button>
        <button class="nav-item" id="tasks-btn">Tasks</button>
        <button class="nav-item" id="apps-btn">Apps</button>
    </div>



    <div class="nav-section" id="bottom-nav">
        {% if nav_logged_in %}
        <button class="nav-item nav-bell" id="notifications-btn" title="Notifications" aria-label="Notifications">
            <span class="icon" style="--icon: url('{{ url_for('static', filename='img/icons/tabler-bell.svg') }}')"></span>
            <span class="nav-bell-dot" id="notifications-dot" hidden aria-hidden="true"></span>
        </button>
        {% endif %}
        <button class="nav-item" id="about-btn" title="About">About</button>
        <button class="nav-item" id="settings-btn" title="Settings">Settings</button>
        {% if nav_logged_in %}
        <button class="nav-item" id="account-btn" title="Account{% if nav_username %}: {{ nav_username }}{% endif %}">Account</button>
        <form method="post" action="/auth/logout" class="nav-item-form">
            <input type="hidden" name="csrf_token" value="{{ request.cookies.get('csrf_token', '') }}">
            <button type="submit" class="nav-item danger">Logout</button>
        </form>
        {% else %}
        <button class="nav-item" id="login-btn">Login</button>
        {% endif %}
    </div>

    <script type="module" src="{{ url_for('static', filename='js/components/sidenav.js') }}"></script>

</aside>
