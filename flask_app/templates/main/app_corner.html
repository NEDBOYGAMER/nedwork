{% extends "base.html" %}

{% block title %}nedwork{% endblock %}

{% block head %}
    <meta name="description" content="Private Dashboard Site">
    <meta property="og:image" content="flask_app/static/img/about/header_img.png">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/app_corner.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/sidenav.css') }}">
    <script>const STATIC_URL = "{{ url_for('static', filename='') }}";</script>

    <script type="module" src="{{ url_for('static', filename='js/pages/app_corner.js') }}"></script>

{% endblock %}

{% block content %}

    <!-- ── Sidebar ──────────────────────────────────────────────────── -->

    {% include "sidenav.html" %}

    <!-- ── Main content ─────────────────────────────────────────────── -->

    <main id="content">

        <!-- Overlay gradient sits above the existing canvas background, below the content -->
        <div id="bg-overlay" aria-hidden="true"></div>

        <header id="app-corner-header">
            <h1 id="app-corner-title">App&nbsp;Corner</h1>
            <p id="app-corner-subtitle" hidden></p>
        </header>

        <div id="shelves-container">
            <!-- Shelves are rendered dynamically by app_corner.js -->
        </div>

    </main>

{% endblock %}
