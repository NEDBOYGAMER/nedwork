{% extends "base.html" %}

{% block title %}nedwork — App Corner{% endblock %}

{% block extra_head %}
    <meta name="description" content="Private Dashboard Site">
    <meta property="og:image" content="{{ url_for('static', filename='img/about/header_img.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/app_corner.css') }}">
{% endblock %}

{% block content %}

    <main class="app-corner">

        <header id="app-corner-header">
            <h1 id="app-corner-title">App Corner</h1>
        </header>

        <div id="shelves-container">
            <!-- Shelves are rendered dynamically by app_corner.js -->
        </div>

    </main>

{% endblock %}

{% block extra_scripts %}
    <script>window.STATIC_URL = "{{ url_for('static', filename='') }}";</script>
    <script type="module" src="{{ url_for('static', filename='js/pages/app_corner.js') }}"></script>
{% endblock %}
