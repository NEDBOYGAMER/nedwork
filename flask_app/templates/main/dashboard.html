<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!--BASIC-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global/colors.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/basic.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/bg.css') }}">

    <!--PAGE-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/dashboard/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/dashboard/widget.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/dashboard/time.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/dashboard/notes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/dashboard/weather.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/dashboard/timer.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script type="module" src="{{ url_for('static', filename='js/pages/dashboard.js') }}"></script>
</head>

<body>

    <div id="cursor"></div>
    <div id="cursor-ring"></div>
    <canvas id="bg-canvas"></canvas>

    <!-- ── Sidebar ──────────────────────────────────────────────────── -->
    <aside id="side-nav">

        <div class="nav-top">
            <div class="logo">Home</div>

        <div class="nav-section">
            <button class="nav-item active">Home</button>
            <button class="nav-item active">Events</button>
            <button class="nav-item active">Tasks</button>
            <button class="nav-item active">Apps</button>
        </div>

        <div class="nav-section grow"></div>

        <div class="nav-section">
            <button class="icon-item" id="about-btn" title="Settings">ℹ️</button>
            <button class="icon-item" id="settings-btn" title="Settings">⚙</button>
            <button class="icon-item" id="account-btn"  title="Account">👤</button>
        </div>

        <div class="nav-bottom">
            <button class="nav-item danger">Logout</button>
        </div>

    </aside>

    <!-- ── Main content ─────────────────────────────────────────────── -->
    <main id="content">

        <header class="dash-header">
            <span class="dash-greeting" id="dash-greeting">Welcome</span>
            <span class="dash-greeting" id="dash-name">Dashboard</span>
        </header>

        <div id="card-grid">
            <!-- Cards injected by dashboard.js -->
        </div>

    </main>


</body>
</html>
